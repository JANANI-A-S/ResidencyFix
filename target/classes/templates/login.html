<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ResidencyFix | Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-shell">
    <main class="login-shell">
        <section class="login-card">
            <p class="eyebrow">Welcome back</p>
            <h1>ResidencyFix access</h1>
            <form method="post" action="/login">
                <div class="login-field">
                    <label for="role">Select role</label>
                    <select id="role" name="role">
                        <option th:each="role : ${roleOptions}" th:value="${#strings.toLowerCase(role)}" th:text="${role}"></option>
                    </select>
                </div>
                <div class="login-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="name@residency.com" />
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="••••••••" />
                </div>
                <button class="btn primary" type="submit">Login</button>
            </form>
        </section>
    </main>
</body>
</html>
